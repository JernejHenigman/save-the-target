name: Build Android Release AAB

on:
  push:
    branches: [ "main" ]

jobs:
  export-android:
    name: Export Android Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Java SDK
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Setup Android SDK Tools
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 3. Decode Release Keystore from GitHub Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > /tmp/release.keystore

      # 4. Export Android AAB via Godot Engine
      - name: Godot Android Export
        uses: dulvui/godot-android-export@v4
        with:
          godot-version: 4.3
          working-directory: .
          export-debug: false
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/release.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # 5. Save Build Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: build/android/
